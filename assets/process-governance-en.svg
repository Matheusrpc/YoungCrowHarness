<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1420" width="760" height="1420" role="img" aria-labelledby="title desc" font-family="Georgia, serif">
<title id="title">06 · Govern skills and MCPs</title><desc id="desc">Catalog, configuration and execution need separate proof. Revocation keeps history. A hash grants no authority.</desc>
