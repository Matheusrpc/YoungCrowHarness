<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" role="img" aria-labelledby="title desc" font-family="Georgia, 'Times New Roman', serif">
<title id="title">03 · Work, review and release</title><desc id="desc">Review before release; save context and distinguish development from observed production.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#F3E7C6"/></marker></defs>
<rect width="1200" height="970" fill="#17130f"/>
<rect x="12" y="12" width="1176" height="946" rx="10" fill="none" stroke="#725a35" stroke-width="2"/>
<path d="M 35 53 L 44 38 L 53 53 L 44 68 Z" fill="#5B2E8A" stroke="#F3E7C6"/>

<text x="68" y="57" text-anchor="start" font-size="29" fill="#F3E7C6">
<tspan x="68" dy="0">03 · Work, review and release</tspan>
</text>
<text x="36" y="93" text-anchor="start" font-size="17" fill="#d6c8a8">
<tspan x="36" dy="0">PM / Tech Lead → executor → reviewer → release owner</tspan>
</text>
<path d="M77 180 H112" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M298 180 H342" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M552 180 H585" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M715 180 H878" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M650 245 V325 H447 V224" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1008 180 H1137 V409 H1105" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M943 245 V295 H698 V365" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M698 453 V525" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M763 590 H912" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1014 546 V510 H855 V325 H447 V224" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M698 655 V785" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1000 453 V478 H1167 V829 H848" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M588 829 H420" fill="none" stroke="#F3E7C6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="205" y="110" text-anchor="middle" font-size="15" fill="#d6c8a8">
<tspan x="205" dy="0">PM / TECH LEAD</tspan>
</text>
<text x="447" y="110" text-anchor="middle" font-size="15" fill="#d6c8a8">
<tspan x="447" dy="0">EXECUTOR</tspan>
</text>
<text x="650" y="110" text-anchor="middle" font-size="15" fill="#d6c8a8">
<tspan x="650" dy="0">REVIEWER</tspan>
</text>
<text x="943" y="110" text-anchor="middle" font-size="15" fill="#d6c8a8">
<tspan x="943" dy="0">RELEASE OWNER</tspan>
</text>
<circle cx="54" cy="180" r="23" fill="#1F7A4D" stroke="#F3E7C6" stroke-width="2"/>
<text x="54" y="233" text-anchor="middle" font-size="17" fill="#F3E7C6">
<tspan x="54" dy="0">Feature</tspan>
</text>
<rect x="112" y="136" width="186" height="88" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="5"/>
<text x="205.0" y="174.0" text-anchor="middle" font-size="18" fill="#17130f" data-max-width="164">
<tspan x="205.0" dy="0">Read the vault and</tspan>
<tspan x="205.0" dy="24">define the delivery</tspan>
</text>
<rect x="342" y="136" width="210" height="88" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="5"/>
<text x="447.0" y="173.5" text-anchor="middle" font-size="19" fill="#17130f" data-max-width="188">
<tspan x="447.0" dy="0">Implement, test</tspan>
<tspan x="447.0" dy="25">and update README</tspan>
</text>
<path d="M650 115 L715 180 L650 245 L585 180 Z" fill="#E8A317" stroke="#F3E7C6" stroke-width="2"/>
<text x="650" y="168" text-anchor="middle" font-size="18" fill="#17130f">
<tspan x="650" dy="0">Review</tspan>
<tspan x="650" dy="24">approved?</tspan>
</text>
<text x="650" y="219" text-anchor="middle" font-size="22" fill="#17130f">
<tspan x="650" dy="0">×</tspan>
</text>
<path d="M943 115 L1008 180 L943 245 L878 180 Z" fill="#E8A317" stroke="#F3E7C6" stroke-width="2"/>
<text x="943" y="168" text-anchor="middle" font-size="18" fill="#17130f">
<tspan x="943" dy="0">Release</tspan>
<tspan x="943" dy="24">authorized?</tspan>
</text>
<text x="943" y="219" text-anchor="middle" font-size="22" fill="#17130f">
<tspan x="943" dy="0">×</tspan>
</text>
<text x="793" y="165" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="793" dy="0">Yes</tspan>
</text>
<text x="626" y="279" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="626" dy="0">No</tspan>
</text>
<text x="550" y="312" text-anchor="middle" font-size="17" fill="#F3E7C6">
<tspan x="550" dy="0">Fix and test</tspan>
</text>
<text x="1109" y="256" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="1109" dy="0">No</tspan>
</text>
<text x="901" y="280" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="901" dy="0">Yes</tspan>
</text>
<rect x="895" y="365" width="210" height="88" rx="9" fill="#F3E7C6" stroke="#5B2E8A" stroke-width="5"/>
<text x="1000.0" y="402.5" text-anchor="middle" font-size="19" fill="#17130f" data-max-width="188">
<tspan x="1000.0" dy="0">Record delivery</tspan>
<tspan x="1000.0" dy="25">without release</tspan>
</text>
<rect x="593" y="365" width="210" height="88" rx="9" fill="#F3E7C6" stroke="#1F7A4D" stroke-width="5"/>
<text x="698.0" y="402.5" text-anchor="middle" font-size="19" fill="#17130f" data-max-width="188">
<tspan x="698.0" dy="0">Deploy and</tspan>
<tspan x="698.0" dy="25">observe environment</tspan>
</text>
<path d="M698 525 L763 590 L698 655 L633 590 Z" fill="#E8A317" stroke="#F3E7C6" stroke-width="2"/>
<text x="698" y="578" text-anchor="middle" font-size="16" fill="#17130f">
<tspan x="698" dy="0">Environment</tspan>
<tspan x="698" dy="22">verified?</tspan>
</text>
<text x="698" y="629" text-anchor="middle" font-size="22" fill="#17130f">
<tspan x="698" dy="0">×</tspan>
</text>
<text x="833" y="574" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="833" dy="0">No</tspan>
</text>
<rect x="912" y="546" width="205" height="88" rx="9" fill="#F3E7C6" stroke="#B3202F" stroke-width="5"/>
<text x="1014.5" y="584.0" text-anchor="middle" font-size="18" fill="#17130f" data-max-width="183">
<tspan x="1014.5" dy="0">Recover / roll back</tspan>
<tspan x="1014.5" dy="24">and record failure</tspan>
</text>
<text x="466" y="719" text-anchor="middle" font-size="18" fill="#F3E7C6">
<tspan x="466" dy="0">Yes · record production evidence</tspan>
</text>
<rect x="588" y="785" width="260" height="88" rx="9" fill="#F3E7C6" stroke="#5B2E8A" stroke-width="5"/>
<text x="718.0" y="822.5" text-anchor="middle" font-size="19" fill="#17130f" data-max-width="238">
<tspan x="718.0" dy="0">Save outcome and</tspan>
<tspan x="718.0" dy="25">next action in the vault</tspan>
</text>
<circle cx="396" cy="829" r="23" fill="#1F7A4D" stroke="#F3E7C6" stroke-width="5"/>
<circle cx="396" cy="829" r="17" fill="none" stroke="#F3E7C6"/>
<text x="396" y="882" text-anchor="middle" font-size="17" fill="#F3E7C6">
<tspan x="396" dy="0">Session closed</tspan>
</text>
<text x="36" y="933" text-anchor="start" font-size="19" fill="#F3E7C6">
<tspan x="36" dy="0">Resume: vault/index.md → feature index → latest run.</tspan>
</text>
</svg>
