<tspan x="35" dy="0">08 · Preparar uma missão</tspan>
</text>
<text x="35" y="93" font-size="20" fill="#d6c8a8" text-anchor="start" data-max-width="690">
<tspan x="35" dy="0">Claude Code e Codex · papéis na sessão atual</tspan>
</text>
