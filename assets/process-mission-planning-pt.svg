<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1470" width="760" height="1470" role="img" aria-labelledby="title desc" font-family="Georgia, serif">
<title id="title">08 · Preparar uma missão</title><desc id="desc">Personalizer. Configurar agentes. Refinar o backlog. Preparar a missão. Missão preparada. Execução automática. ainda indisponível</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F3E7C6"/></marker></defs>
