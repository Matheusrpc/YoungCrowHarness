<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1470" width="760" height="1470" role="img" aria-labelledby="title desc" font-family="Georgia, serif">
<title id="title">08 · Prepare a mission</title><desc id="desc">Personalizer. Configure agents. Refine the backlog. Prepare the mission. Mission prepared. Automatic execution. is not available yet</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F3E7C6"/></marker></defs>
<rect width="760" height="1470" fill="#17130f"/><rect x="12" y="12" width="736" height="1446" rx="10" fill="none" stroke="#725a35" stroke-width="2"/>
<text x="35" y="53" font-size="28" fill="#F3E7C6" text-anchor="start" data-max-width="690">
<tspan x="35" dy="0">08 · Prepare a mission</tspan>
</text>
<text x="35" y="93" font-size="20" fill="#d6c8a8" text-anchor="start" data-max-width="690">
<tspan x="35" dy="0">Claude Code and Codex · roles in the current session</tspan>
</text>
<circle cx="292.5" cy="131" r="13" fill="#1F7A4D" stroke="#F3E7C6" stroke-width="2"/>
