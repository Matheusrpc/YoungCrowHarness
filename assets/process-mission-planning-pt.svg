<text x="292.5" y="1009" font-size="23" fill="#17130f" text-anchor="middle" data-max-width="430">
<tspan x="292.5" dy="0">Consultar estado</tspan>
<tspan x="292.5" dy="30">yc-status: histórico e fontes</tspan>
<tspan x="292.5" dy="30">Somente leitura</tspan>
</text>
<path d="M292.5 1084V1125" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="1125" width="455" height="130" rx="30" fill="#1F7A4D" stroke="#F3E7C6" stroke-width="3"/>
<text x="292.5" y="1160" font-size="24" fill="#F3E7C6" text-anchor="middle" data-max-width="430">
<tspan x="292.5" dy="0">Missão preparada</tspan>
<tspan x="292.5" dy="30">Execução automática</tspan>
<tspan x="292.5" dy="30">ainda indisponível</tspan>
</text>
<text x="35" y="1335" font-size="20" fill="#d6c8a8" text-anchor="start" data-max-width="690">
<tspan x="35" dy="0">Novas notas e eventos ficam no vault privado.</tspan>
<tspan x="35" dy="30">Três PBIs ativos por padrão; o total pode ser maior.</tspan>
<tspan x="35" dy="30">Trial: guardar o ponto inicial antes da primeira escrita.</tspan>
</text>
</svg>
