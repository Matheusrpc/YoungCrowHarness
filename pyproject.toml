[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youngcrow"
dynamic = ["version"]
description = "YoungCrowHarness: a vault, document ingestion and memory harness for coding agents."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
youngcrow = "youngcrow.cli:main"

[tool.hatch.version]
path = "src/youngcrow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/youngcrow"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/vault.py" = "youngcrow/payload/scripts/vault.py"
"scripts/document_store.py" = "youngcrow/payload/scripts/document_store.py"
"scripts/documents.py" = "youngcrow/payload/scripts/documents.py"
"scripts/docling_worker.py" = "youngcrow/payload/scripts/docling_worker.py"
"scripts/source_fetch.py" = "youngcrow/payload/scripts/source_fetch.py"
"scripts/source_prompt.py" = "youngcrow/payload/scripts/source_prompt.py"
"scripts/memory.py" = "youngcrow/payload/scripts/memory.py"
"scripts/graphify_worker.py" = "youngcrow/payload/scripts/graphify_worker.py"
"scripts/capabilities.py" = "youngcrow/payload/scripts/capabilities.py"
"scripts/integrations.py" = "youngcrow/payload/scripts/integrations.py"
"scripts/personalize.py" = "youngcrow/payload/scripts/personalize.py"
"scripts/adoption.py" = "youngcrow/payload/scripts/adoption.py"
"scripts/adoption_fs.py" = "youngcrow/payload/scripts/adoption_fs.py"
"scripts/adoption_acl.ps1" = "youngcrow/payload/scripts/adoption_acl.ps1"
"requirements/docling.txt" = "youngcrow/payload/requirements/docling.txt"
"requirements/docling-media.txt" = "youngcrow/payload/requirements/docling-media.txt"
"requirements/graphify.txt" = "youngcrow/payload/requirements/graphify.txt"
"vault/index.md" = "youngcrow/payload/vault/index.md"
"vault/integrations/index.md" = "youngcrow/payload/vault/integrations/index.md"
"vault/capabilities/index.md" = "youngcrow/payload/vault/capabilities/index.md"
