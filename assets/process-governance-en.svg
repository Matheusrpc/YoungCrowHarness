<path d="M288 834V910" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M288 994V1090" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M288 1174V1260" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M358 470H535V952H510" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M510 972H565" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M510 1132H565" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="140" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="4"/>
<text x="287.5" y="174" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Discover capabilities</tspan>
<tspan x="287.5" dy="30">Index, ID and contract</tspan>
</text>
<rect x="65" y="270" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="4"/>
<text x="287.5" y="304" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Audit the client</tspan>
<tspan x="287.5" dy="30">Files, origin and access</tspan>
</text>
<rect x="65" y="600" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#E8A317" stroke-width="4"/>
<text x="287.5" y="634" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Review scope</tspan>
<tspan x="287.5" dy="30">Private bundle and authorization</tspan>
</text>
<rect x="65" y="750" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#5B2E8A" stroke-width="4"/>
<text x="287.5" y="784" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Apply authorized change</tspan>
<tspan x="287.5" dy="30">Preserve existing rules</tspan>
</text>
<rect x="65" y="910" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="4"/>
<text x="287.5" y="944" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Prove in the client</tspan>
<tspan x="287.5" dy="30">Allow, deny and revoke</tspan>
</text>
<rect x="65" y="1090" width="445" height="84" rx="9" fill="#F3E7C6" stroke="#1F7A4D" stroke-width="4"/>
<text x="287.5" y="1124" text-anchor="middle" font-size="23" fill="#17130f" data-max-width="423">
<tspan x="287.5" dy="0">Record use in the vault</tspan>
<tspan x="287.5" dy="30">Version, evidence and next action</tspan>
</text>
<path d="M288 400L358 470L288 540L218 470Z" fill="#E8A317" stroke="#F3E7C6" stroke-width="2"/>
<text x="288" y="462" text-anchor="middle" font-size="22" fill="#17130f" data-max-width="108">
<tspan x="288" dy="0">Any</tspan>
<tspan x="288" dy="30">drift?</tspan>
</text>
<text x="325" y="578" text-anchor="middle" font-size="20" fill="#F3E7C6" data-max-width="70">
<tspan x="325" dy="0">Yes</tspan>
</text>
<text x="430" y="450" text-anchor="middle" font-size="20" fill="#F3E7C6" data-max-width="70">
<tspan x="430" dy="0">No</tspan>
</text>
<rect x="565" y="910" width="165" height="125" rx="9" fill="#F3E7C6" stroke="#B3202F" stroke-width="4"/>
<text x="647.5" y="944" text-anchor="middle" font-size="18" fill="#17130f" data-max-width="143">
<tspan x="647.5" dy="0">Failure or</tspan>
<tspan x="647.5" dy="30">unknown:</tspan>
<tspan x="647.5" dy="30">pending</tspan>
</text>
<rect x="565" y="1090" width="165" height="125" rx="9" fill="#F3E7C6" stroke="#5B2E8A" stroke-width="4"/>
<text x="647.5" y="1124" text-anchor="middle" font-size="17" fill="#17130f" data-max-width="143">
<tspan x="647.5" dy="0">Revoke access</tspan>
<tspan x="647.5" dy="30">Start new session</tspan>
<tspan x="647.5" dy="30">Test and record</tspan>
</text>
<circle cx="288" cy="1274" r="14" fill="#1F7A4D" stroke="#F3E7C6" stroke-width="5"/>
<text x="35" y="1347" text-anchor="start" font-size="19" fill="#d6c8a8" data-max-width="695">
<tspan x="35" dy="0">Codex: synthetic proof passed. Claude: proof pending.</tspan>
</text>
<text x="35" y="1382" text-anchor="start" font-size="19" fill="#d6c8a8" data-max-width="695">
<tspan x="35" dy="0">Revocation keeps history. A hash grants no authority.</tspan>
</text>
</svg>
