<tspan x="292.5" dy="30">PM: épicos/features e DoR/DoD</tspan>
<tspan x="292.5" dy="30">Tech Lead: PBIs e dependências</tspan>
</text>
<path d="M292.5 564V605" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="605" width="455" height="104" rx="9" fill="#F3E7C6" stroke="#1F4FA3" stroke-width="4"/>
<text x="292.5" y="634" font-size="23" fill="#17130f" text-anchor="middle" data-max-width="430">
<tspan x="292.5" dy="0">Preparar a missão</tspan>
<tspan x="292.5" dy="30">Selecionar 1 a N features</tspan>
<tspan x="292.5" dy="30">Congelar escolhas e referências</tspan>
</text>
<path d="M292.5 709V750" fill="none" stroke="#F3E7C6" stroke-width="2.5" marker-end="url(#arrow)"/>
