name: Installer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Bash syntax
        run: bash -n setup.sh
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Exercise reversible adoption in all client profiles
        shell: bash
        run: |
          for client in claude codex both; do
            python3 -B tests/smoke_adoption.py --root "$RUNNER_TEMP/adoption-$client" --client "$client" || exit "$?"
          done
  adoption-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Diagnose disposable Windows fixture
        run: |
          $probe = Join-Path $env:RUNNER_TEMP ('yc-profile-' + [guid]::NewGuid().ToString('N'))
          [void][System.IO.Directory]::CreateDirectory($probe)
          [System.IO.File]::WriteAllText((Join-Path $probe 'file.txt'), 'synthetic')
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          foreach ($path in @($probe, (Join-Path $probe 'file.txt'))) {
            $acl = Get-Acl -LiteralPath $path
            @{owner_matches_user=($acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -eq $sid);
              owner_is_administrators=($acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-544');
              protected=$acl.AreAccessRulesProtected; explicit_rules=@($acl.Access | Where-Object {-not $_.IsInherited}).Count} | ConvertTo-Json -Compress
          }
          @'
          import os, pathlib, subprocess, time
          shell = pathlib.Path(os.environ['SystemRoot']) / 'System32/WindowsPowerShell/v1.0/powershell.exe'
          for label, profile in [('null', os.devnull), ('existing_file', str(shell))]:
              env = dict(os.environ, USERPROFILE=profile, LOCALAPPDATA=profile, APPDATA=profile,
                         PSModulePath=str(shell.parent / 'Modules'), PSModuleAnalysisCachePath=os.devnull)
              started = time.monotonic()
              result = subprocess.run([str(shell), '-NoProfile', '-NonInteractive', '-Command', 'exit 0'], env=env, timeout=120)
              print(label, 'exit', result.returncode, 'seconds', round(time.monotonic() - started, 3), flush=True)
          '@ | python -B -
      - name: Verify native storage, permissions and crash recovery
        run: python -B -m unittest discover -s tests -p "test_adoption*.py" -v -f
      - name: Verify trial installer and unchanged global profile
        run: python -B -m unittest discover -s tests -p test_setup.py -k trial -v -f
      - name: Exercise return through the external runner
        run: python -B tests/smoke_adoption.py --root "$env:RUNNER_TEMP/adoption-both" --client both
  graphify-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Seed disposable memory project
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider markdown
      - name: Install pinned optional runtime
        run: python3.12 scripts/memory.py --root .runtime/memory-proof setup-graphify
      - name: Exercise actual local Graphify and failure recovery
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider graphify
