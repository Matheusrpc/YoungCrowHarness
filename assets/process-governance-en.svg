<tspan x="35" dy="0">06 · Govern skills and MCPs</tspan>
</text>
<text x="35" y="92" text-anchor="start" font-size="20" fill="#d6c8a8" data-max-width="695">
<tspan x="35" dy="0">Catalog, configuration and execution need separate proof</tspan>
</text>
