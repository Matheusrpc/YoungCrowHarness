name: Installer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Bash syntax
        run: bash -n setup.sh
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Exercise reversible adoption in all client profiles
        shell: bash
        run: |
          for client in claude codex both; do
            python3 -B tests/smoke_adoption.py --root "$RUNNER_TEMP/adoption-$client" --client "$client" || exit "$?"
          done
  windows-startup-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Measure remaining helper initialization
        run: |
          $shell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $env:USERPROFILE = 'NUL'
          $env:LOCALAPPDATA = 'NUL'
          $env:APPDATA = 'NUL'
          $env:PSModuleAnalysisCachePath = 'NUL'
          $env:PSModulePath = Join-Path (Split-Path $shell) 'Modules'
          $commands = @(
            '$null = New-Object System.Text.UTF8Encoding($false)',
            '$null = [System.Text.UTF8Encoding]::new($false)',
            '@{private=$true} | ConvertTo-Json -Compress',
            'Import-Module ($PSHOME + "/Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1"); @{private=$true} | ConvertTo-Json -Compress',
            '[void][System.Reflection.Assembly]::Load("System.Web.Extensions, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35"); [Console]::WriteLine([System.Web.Script.Serialization.JavaScriptSerializer]::new().Serialize(@{private=$true}))'
          )
          foreach ($command in $commands) {
            $time = Measure-Command { & $shell -NoProfile -NonInteractive -Command $command | Write-Host }
            Write-Output "$command : exit=$LASTEXITCODE seconds=$($time.TotalSeconds)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  adoption-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify native storage, permissions and crash recovery
        run: python -B tests/windows_fixture_runner.py -m unittest discover -s tests -p "test_adoption*.py" -v -f
      - name: Verify trial installer and unchanged global profile
        run: python -B tests/windows_fixture_runner.py -m unittest discover -s tests -p test_setup.py -k trial -v -f
      - name: Exercise return through the external runner
        run: python -B tests/windows_fixture_runner.py tests/smoke_adoption.py --root "$env:RUNNER_TEMP/adoption-both" --client both
  graphify-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Seed disposable memory project
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider markdown
      - name: Install pinned optional runtime
        run: python3.12 scripts/memory.py --root .runtime/memory-proof setup-graphify
      - name: Exercise actual local Graphify and failure recovery
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider graphify
