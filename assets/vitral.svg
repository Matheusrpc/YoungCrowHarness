<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">YouthHarness</title>
  <desc id="d">A chapel stained-glass window with a crow wearing a Saint Benedict medal, and the name YouthHarness beside it.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a221c"/>
      <stop offset="1" stop-color="#171210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset=".5" stop-color="#d9a21b"/>
      <stop offset="1" stop-color="#8c6a12"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <circle cx="1" cy="1" r=".6" fill="#ffffff" fill-opacity=".05"/>
      <circle cx="4" cy="4" r=".6" fill="#000000" fill-opacity=".08"/>
    </pattern>
    <clipPath id="arch">
      <path d="M120 470 V240 A230 230 0 0 1 580 240 V470 Z"/>
    </clipPath>
    <clipPath id="lancetL"><rect x="150" y="250" width="100" height="220"/></clipPath>
    <clipPath id="lancetR"><rect x="450" y="250" width="100" height="220"/></clipPath>
    <clipPath id="lancetC"><rect x="270" y="235" width="160" height="235"/></clipPath>
    <clipPath id="rose"><circle cx="350" cy="150" r="82"/></clipPath>
  </defs>

  <!-- stone wall -->
  <rect width="1200" height="520" fill="url(#stone)"/>
  <rect width="1200" height="520" fill="url(#grain)"/>

  <!-- window outer frame -->
  <path d="M100 490 V240 A250 250 0 0 1 600 240 V490 Z" fill="#0f0c0a"/>
  <path d="M120 470 V240 A230 230 0 0 1 580 240 V470 Z" fill="#1a1512"/>

  <!-- glass, clipped to the arch -->
  <g clip-path="url(#arch)">
    <!-- background panes in the arch head: a colour fan around the rose -->
    <g stroke="#17130f" stroke-width="5" stroke-linejoin="round">
      <path d="M120 240 L120 120 L200 90 L232 210 L120 240 Z" fill="#1F4FA3"/>
      <path d="M200 90 L290 40 L300 120 L232 210 Z" fill="#B3202F"/>
      <path d="M290 40 L410 40 L400 120 L300 120 Z" fill="#E8A317"/>
      <path d="M410 40 L500 90 L468 210 L400 120 Z" fill="#1F7A4D"/>
      <path d="M500 90 L580 120 L580 240 L468 210 Z" fill="#5B2E8A"/>
      <path d="M120 240 L232 210 L270 235 L120 260 Z" fill="#1B7F8C"/>
      <path d="M580 240 L468 210 L430 235 L580 260 Z" fill="#B3202F"/>
    </g>

    <!-- lancet backgrounds -->
    <g stroke="#17130f" stroke-width="5">
      <rect x="150" y="250" width="100" height="220" fill="#1F4FA3"/>
      <rect x="450" y="250" width="100" height="220" fill="#1F4FA3"/>
      <rect x="270" y="235" width="160" height="235" fill="#F3E7C6"/>
    </g>

    <!-- left lancet: diamonds -->
    <g clip-path="url(#lancetL)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
      <path d="M200 250 L250 300 L200 350 L150 300 Z" fill="#B3202F"/>
      <path d="M200 350 L250 400 L200 450 L150 400 Z" fill="#E8A317"/>
      <path d="M150 250 L200 300 L150 350 Z" fill="#1B7F8C"/>
      <path d="M250 250 L200 300 L250 350 Z" fill="#5B2E8A"/>
      <path d="M150 350 L200 400 L150 450 Z" fill="#1F7A4D"/>
      <path d="M250 350 L200 400 L250 450 Z" fill="#B3202F"/>
      <path d="M150 450 L200 500 L250 450 L200 400 Z" fill="#5B2E8A"/>
    </g>
    <!-- right lancet: diamonds, mirrored colours -->
    <g clip-path="url(#lancetR)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
      <path d="M500 250 L550 300 L500 350 L450 300 Z" fill="#1F7A4D"/>
      <path d="M500 350 L550 400 L500 450 L450 400 Z" fill="#B3202F"/>
      <path d="M450 250 L500 300 L450 350 Z" fill="#E8A317"/>
      <path d="M550 250 L500 300 L550 350 Z" fill="#1B7F8C"/>
      <path d="M450 350 L500 400 L450 450 Z" fill="#5B2E8A"/>
      <path d="M550 350 L500 400 L550 450 Z" fill="#E8A317"/>
      <path d="M450 450 L500 500 L550 450 L500 400 Z" fill="#1F7A4D"/>
    </g>

    <!-- centre lancet: pale glass with a halo, the crow on a perch -->
    <g clip-path="url(#lancetC)">
      <rect x="270" y="235" width="160" height="235" fill="#F3E7C6"/>
      <circle cx="350" cy="330" r="70" fill="#E8A317" fill-opacity=".55"/>
      <circle cx="350" cy="330" r="70" fill="none" stroke="#17130f" stroke-width="4"/>
      <!-- rays -->
      <g stroke="#17130f" stroke-width="3">
        <line x1="350" y1="235" x2="350" y2="262"/>
        <line x1="270" y1="330" x2="282" y2="330"/>
        <line x1="418" y1="330" x2="430" y2="330"/>
        <line x1="290" y1="270" x2="302" y2="282"/>
        <line x1="410" y1="270" x2="398" y2="282"/>
      </g>
      <!-- perch -->
      <path d="M270 404 Q350 398 430 406" fill="none" stroke="#17130f" stroke-width="8" stroke-linecap="round"/>
      <!-- crow, faceted, perched -->
      <g transform="translate(284 250) scale(.86)" stroke="#17130f" stroke-width="4" stroke-linejoin="round">
        <polygon points="118,146 152,178 140,188 108,160" fill="#1c1720"/>
        <polygon points="50,90 75,62 110,58 135,80 140,120 120,150 85,158 58,135" fill="#1c1720"/>
        <polygon points="78,74 120,66 138,92 126,132 96,130 72,106" fill="#2b2434"/>
        <polygon points="62,66 58,44 72,30 92,32 98,50 88,66" fill="#2b2434"/>
        <polygon points="58,40 28,50 60,52" fill="#3a3040"/>
        <circle cx="77" cy="43" r="3.5" fill="#f6d77a"/>
        <line x1="88" y1="158" x2="84" y2="178"/>
        <line x1="106" y1="156" x2="110" y2="178"/>
        <!-- ribbon and medal -->
        <path d="M66 68 Q62 84 66 96 M84 68 Q86 84 82 96" fill="none" stroke="#8c6a12" stroke-width="3"/>
        <circle cx="72" cy="108" r="17" fill="url(#gold)" stroke="#8c6a12" stroke-width="3"/>
        <circle cx="72" cy="108" r="11" fill="none" stroke="#8c6a12" stroke-width="1.5"/>
        <path d="M72 100 V116 M65 106 H79" stroke="#4a3608" stroke-width="3" stroke-linecap="round" fill="none"/>
        <text x="72" y="98.5" font-family="Georgia, 'Times New Roman', serif" font-size="5.5" font-weight="700" fill="#4a3608" text-anchor="middle" stroke="none">PAX</text>
      </g>
    </g>

    <!-- rose window -->
    <g clip-path="url(#rose)" stroke="#17130f" stroke-width="5" stroke-linejoin="round">
      <circle cx="350" cy="150" r="82" fill="#E8A317"/>
      <path d="M350 150 L350 68 A82 82 0 0 1 408 92 Z" fill="#B3202F"/>
      <path d="M350 150 L408 92 A82 82 0 0 1 432 150 Z" fill="#1F4FA3"/>
      <path d="M350 150 L432 150 A82 82 0 0 1 408 208 Z" fill="#1F7A4D"/>
      <path d="M350 150 L408 208 A82 82 0 0 1 350 232 Z" fill="#5B2E8A"/>
      <path d="M350 150 L350 232 A82 82 0 0 1 292 208 Z" fill="#B3202F"/>
      <path d="M350 150 L292 208 A82 82 0 0 1 268 150 Z" fill="#1B7F8C"/>
      <path d="M350 150 L268 150 A82 82 0 0 1 292 92 Z" fill="#1F4FA3"/>
      <path d="M350 150 L292 92 A82 82 0 0 1 350 68 Z" fill="#E8A317"/>
      <circle cx="350" cy="150" r="28" fill="#F3E7C6"/>
      <path d="M350 132 V168 M332 150 H368" stroke="#17130f" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- glass sheen over everything -->
    <rect x="100" y="0" width="500" height="490" fill="url(#glow)"/>
  </g>

  <!-- tracery: mullions and arch rib -->
  <g fill="none" stroke="#0f0c0a" stroke-width="12" stroke-linecap="round">
    <path d="M120 470 V240 A230 230 0 0 1 580 240 V470"/>
    <line x1="150" y1="250" x2="150" y2="470"/>
    <line x1="250" y1="250" x2="250" y2="470"/>
    <line x1="270" y1="235" x2="270" y2="470"/>
    <line x1="430" y1="235" x2="430" y2="470"/>
    <line x1="450" y1="250" x2="450" y2="470"/>
    <line x1="550" y1="250" x2="550" y2="470"/>
    <line x1="120" y1="470" x2="580" y2="470"/>
    <circle cx="350" cy="150" r="88"/>
  </g>
  <!-- sill -->
  <rect x="90" y="470" width="520" height="22" rx="4" fill="#0f0c0a"/>
  <rect x="80" y="486" width="540" height="10" rx="3" fill="#2a221c"/>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#F3E7C6">
    <text x="660" y="212" font-size="86" font-weight="700" letter-spacing="-2">Youth<tspan fill="#E8A317">Harness</tspan></text>
    <text x="664" y="262" font-size="22" fill="#d3c7ad">A starting point for Claude Code and Codex projects.</text>
    <text x="664" y="296" font-size="22" fill="#d3c7ad">Ponto de partida para projetos com Claude Code e Codex.</text>
    <line x1="664" y1="330" x2="1120" y2="330" stroke="#8c6a12" stroke-width="2"/>
    <text x="664" y="372" font-size="26" fill="#f6d77a">☧ Ora et labora ☧ et coda &lt;/&gt;</text>
    <text x="664" y="416" font-size="18" fill="#a8997c">no secrets inside · sem segredos dentro</text>
  </g>
</svg>
